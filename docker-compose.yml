services:
  devtools:
    build:
      context: .
      dockerfile: Dockerfile
    image: devtools:local
    container_name: devtools
    restart: unless-stopped
    ports:
      - "8091:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
