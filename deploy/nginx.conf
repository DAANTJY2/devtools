# nginx configuration for DevTools (static files).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers live in headers.inc (add_header in a location replaces the server's).
    include /etc/nginx/conf.d/headers.inc;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json text/plain image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/headers.inc;
    }
    # Libraries, data and fonts only change with a new release.
    location ~ ^/(vendor|fonts|data)/ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/conf.d/headers.inc;
    }
}
